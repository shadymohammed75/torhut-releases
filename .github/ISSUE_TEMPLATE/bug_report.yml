name: Bug report
description: Something in Torhut doesn't work
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Please don't paste API keys, private code or company data. Remove them from logs first."
  - type: input
    id: version
    attributes:
      label: Torhut version
      placeholder: "0.5.0"
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: OS, VS Code version, Python version
      placeholder: "Windows 11, VS Code 1.96, Python 3.12"
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Provider
      options: [OpenRouter, Anthropic, Ollama, Company / EU endpoint, Demo mode (no key)]
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: log
    attributes:
      label: Output
      description: "View → Output → Torhut (remove anything private)"
      render: text
